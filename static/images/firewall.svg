<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="500" height="300" fill="url(#bg)"/>
  <!-- Rack Unit -->
  <rect x="50" y="90" width="400" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Vents -->
  <circle cx="80" cy="150" r="6" fill="#38bdf8"/>
  <circle cx="100" cy="150" r="6" fill="#10b981"/>
  <circle cx="120" cy="150" r="6" fill="#f59e0b"/>
  <!-- Ethernet ports -->
  <rect x="160" y="135" width="20" height="30" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="190" y="135" width="20" height="30" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="220" y="135" width="20" height="30" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="250" y="135" width="20" height="30" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <!-- Shield Emblem -->
  <path d="M 360 115 L 410 115 L 410 155 C 410 175 385 190 385 190 C 385 190 360 175 360 155 Z" fill="url(#shield)"/>
  <text x="250" y="245" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="16" font-weight="bold">CYBER SHIELD FIREWALL HARDWARE</text>
</svg>
