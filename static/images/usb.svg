  <rect x="345" y="132" width="12" height="8" fill="#64748b"/>
  <rect x="345" y="150" width="12" height="8" fill="#64748b"/>
  <text x="250" y="240" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="16" font-weight="bold">AES-256 ENCRYPTED KEYPAD USB DRIVE</text>
