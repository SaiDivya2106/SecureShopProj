  <!-- Keypad Buttons -->
  <circle cx="180" cy="130" r="8" fill="#0f172a"/><circle cx="210" cy="130" r="8" fill="#0f172a"/><circle cx="240" cy="130" r="8" fill="#0f172a"/>
  <circle cx="180" cy="160" r="8" fill="#0f172a"/><circle cx="210" cy="160" r="8" fill="#0f172a"/><circle cx="240" cy="160" r="8" fill="#0f172a"/>
  <!-- Status LEDs -->
