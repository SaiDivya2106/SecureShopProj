{% extends "base.html" %}

{% block title %}Register - SecureShop{% endblock %}

{% block content %}
<div class="form-card">
    <h2 class="form-title"><i class="fas fa-user-plus" style="color: var(--accent-blue);"></i> Create New Account</h2>
    <form action="{{ url_for('register') }}" method="POST">
        <div class="form-group">
            <label class="form-label">Username *</label>
            <input type="text" name="username" class="form-control" required placeholder="Choose a username">
        </div>

        <div class="form-group">
            <label class="form-label">Email Address *</label>
            <input type="email" name="email" class="form-control" required placeholder="name@example.com">
        </div>

        <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" placeholder="John Doe">
        </div>

        <div class="form-group">
            <label class="form-label">Shipping Address</label>
            <input type="text" name="address" class="form-control" placeholder="123 Main St, City, Country">
        </div>

        <div class="form-group">
            <label class="form-label">Password *</label>
            <input type="password" name="password" class="form-control" required placeholder="Create a password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            <i class="fas fa-user-check"></i> Register Account
        </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="{{ url_for('login') }}" style="color: var(--accent-blue);">Log in here</a>
    </div>
</div>
{% endblock %}
